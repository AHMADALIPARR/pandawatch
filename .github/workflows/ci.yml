name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-python-no-javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse Python / JavaScript / TypeScript / Metal sources
        run: |
          bad=$(git ls-files | grep -Ei '\.(py|pyw|pyi|ipynb|js|mjs|cjs|jsx|ts|tsx|metal)$|(^|/)(package\.json|package-lock\.json|requirements\.txt|setup\.py|pyproject\.toml)$' || true)
          if [ -n "$bad" ]; then echo "Forbidden files:"; echo "$bad"; exit 1; fi
          shebang=$(git ls-files -z | xargs -0 grep -lE '^#!.*\b(python[0-9.]*|node|deno|bun)\b' 2>/dev/null || true)
          if [ -n "$shebang" ]; then echo "Forbidden interpreters:"; echo "$shebang"; exit 1; fi
          echo "no Python, JavaScript, TypeScript or Metal files tracked"

  c11:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain versions
        run: ${{ matrix.cc }} --version && cmake --version
      - name: Configure (C11, -Wall -Wextra -Wpedantic -Werror)
        run: cmake -S . -B build -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_BUILD_TYPE=RelWithDebInfo -DPW_XASM=OFF
      - name: Build
        run: cmake --build build -j1
      - name: ctest
        run: ctest --test-dir build --output-on-failure -V
      - name: Cross-check pw-xray sha256 against coreutils sha256sum
        run: |
          for f in native/Trust.als native/Trust.agda native/geometry.fut native/proxy.awk \
                   native/tests/proxy.tsv LICENSE-AGPL-3.0 docs/source/engine-spec.md; do
            a=$(./build/pw-xray sha256 "$f" | cut -d' ' -f1)
            b=$(sha256sum "$f" | cut -d' ' -f1)
            echo "$a $b $f"; [ "$a" = "$b" ]
          done
      - name: Demo bundle matches committed golden digest (cross-compiler determinism)
        run: |
          ./build/pw-xray demo --binary native/tests/proxy.tsv --alloy native/Trust.als -o demo.pwxray
          got=$(sha256sum demo.pwxray | cut -d' ' -f1)
          want=$(awk '$1=="bundle_sha256"{print $2}' tests/fixtures/demo-bundle.golden)
          echo "got  $got"; echo "want $want"; [ "$got" = "$want" ]
          ./build/pw-xray-verify demo.pwxray --binary native/tests/proxy.tsv
          ./build/pw-xray inspect demo.pwxray

  xasm:
    name: pw-xasm (C23 + FORTRAN 77 + x86-64 asm, ${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install gfortran and binutils (objdump)
        run: sudo apt-get update -q && sudo apt-get install -y -q gfortran binutils
      - name: Toolchain versions
        run: ${{ matrix.cc }} --version && gfortran --version && objdump --version | head -1 && cmake --version
      - name: Configure (C23 for pw-xasm, gfortran -std=legacy, GNU as)
        run: cmake -S . -B build -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_Fortran_COMPILER=gfortran -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build
        run: cmake --build build -j1
      - name: Require the pw-xasm targets
        run: test -x build/pw-xasm && test -x build/test_xasm
      - name: ctest
        run: ctest --test-dir build --output-on-failure -V
      - name: pw-xasm CLI
        run: |
          ./build/pw-xasm layout
          ./build/pw-xasm asm tests/xasm/corpus.s -o corpus.bin
          ./build/pw-xasm disasm corpus.bin
          ./build/pw-xasm lift corpus.bin -o corpus.pwxray
          ./build/pw-xray-verify corpus.pwxray --binary corpus.bin
          ./build/pw-xasm structs corpus.pwxray

  holo:
    name: holo tools (C23, ${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install sqlite3 CLI and wabt (wasm-validate)
        run: sudo apt-get update -q && sudo apt-get install -y -q sqlite3 wabt
      - name: Toolchain versions
        run: ${{ matrix.cc }} --version && cmake --version && sqlite3 --version && wasm-validate --version
      - name: Configure (C23, -Wall -Wextra -Wpedantic -Werror)
        run: cmake -S . -B build -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_BUILD_TYPE=RelWithDebInfo -DPW_XASM=OFF
      - name: Build
        run: cmake --build build -j1
      - name: Require the holo targets
        run: test -x build/rblob && test -x build/bsm && test -x build/holo-reverse
      - name: ctest (holo)
        run: ctest --test-dir build --output-on-failure -V -R 'rblob|bsm|holo_reverse'
      - name: bsm pack every fixture kind, inspect, wasm-validate
        run: |
          mkdir -p out
          sqlite3 out/ledger.db < tests/fixtures/bsm/ledger.sql
          ${{ matrix.cc }} -nostdlib -static -no-pie -o out/ledger.elf tests/fixtures/bsm/ledger_elf.S
          ./build/bsm pack tests/fixtures/bsm/account.h tests/fixtures/bsm/account.cpy \
            tests/fixtures/bsm/ledger.sql out/ledger.db tests/fixtures/bsm/ledger.s \
            out/ledger.elf tests/fixtures/rust_ledger -o out/ledger.holo.wasm
          ./build/bsm inspect out/ledger.holo.wasm
          ./build/bsm pack tests/fixtures/bsm/account.h --abi wasm32 -o out/account32.holo.wasm
          for w in out/*.holo.wasm build/bsm-cli/*.holo.wasm; do wasm-validate "$w"; echo "valid: $w"; done
      - name: holo-reverse (C23 header, CompCert .v, Lean HoloDSL)
        run: |
          ./build/bsm pack tests/fixtures/bsm/account.h tests/fixtures/bsm/account.cpy \
            tests/fixtures/bsm/ledger.sql tests/fixtures/bsm/ledger.s tests/fixtures/rust_ledger \
            -o out/reverse.holo.wasm
          ./build/holo-reverse out/reverse.holo.wasm --out-dir out/reversed
          ./build/holo-reverse out/reverse.holo.wasm --out-dir out/reversed/lean --lean-import HoloDSL.HoloDSL_checked
      - name: C23 / C11 compile of holo_reversed_c23.h (committed, checked copy, generated)
        run: |
          for std in c23 c11; do
            for h in include/pandawatch/holo_reversed_c23.h out/reversed/holo_reversed_c23.h; do
              ${{ matrix.cc }} -std=$std -Wall -Wextra -Werror -fsyntax-only -include "$h" -x c /dev/null
              echo "$std ok: $h"
            done
            ${{ matrix.cc }} -std=$std -Wall -Wextra -Wpedantic -Werror -fsyntax-only \
              -include include/pandawatch/holo_reversed_c23_checked.h -x c /dev/null
            echo "$std -Wpedantic ok: include/pandawatch/holo_reversed_c23_checked.h"
          done
      - name: Upload holo-reverse output
        if: matrix.cc == 'gcc'
        uses: actions/upload-artifact@v4
        with:
          name: holo-reversed
          path: out/reversed
      - name: rblob CLI on the rust_ledger fixture
        run: |
          ./build/rblob ingest tests/fixtures/rust_ledger -o out/rust_ledger.rblob
          ./build/rblob verify out/rust_ledger.rblob
          ./build/rblob disassemble out/rust_ledger.rblob

  lean:
    name: Lean 4 HoloDSL (lake build)
    needs: holo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: holo-reversed
          path: out/reversed
      - name: Install elan (toolchain from lean/lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: lake build (HoloDSL_checked, wa_holo! theorems on the starter records)
        working-directory: lean
        run: lake build
      - name: lake build HoloReversed (holo-reverse --lean-import output)
        run: |
          cp out/reversed/lean/HoloDSL.lean lean/HoloReversed.lean
          cd lean && lake build HoloReversed

  coq-compcert:
    name: Coq + CompCert (coqc)
    needs: holo
    runs-on: ubuntu-latest
    container:
      image: coqorg/coq:8.20
      options: --user root
    env:
      OPAMROOT: /home/coq/.opam
      OPAMROOTISOK: "1"
      OPAMYES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: holo-reversed
          path: out/reversed
      - name: opam install coq-compcert
        run: |
          git config --global --add safe.directory '*'
          eval $(opam env)
          opam repo remove archive --all || true
          opam update
          opam install coq-compcert
          coqc --version
      - name: coqc coq/HoloLayout.v
        run: |
          eval $(opam env)
          coqc coq/HoloLayout.v
      - name: coqc holo-reverse holo_compcert.v
        run: |
          eval $(opam env)
          coqc out/reversed/holo_compcert.v

  awk-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gawk and busybox (default awk on the runner is mawk)
        run: sudo apt-get update -q && sudo apt-get install -y -q gawk busybox
      - name: README verification commands (default awk)
        working-directory: native
        run: |
          awk -f proxy.awk tests/proxy.tsv > /tmp/pandawatch-proxy.tsv
          diff -u tests/proxy.expected.tsv /tmp/pandawatch-proxy.tsv
      - name: Same oracle under gawk --posix, mawk and busybox awk
        working-directory: native
        run: |
          gawk --posix -f proxy.awk tests/proxy.tsv | diff -u tests/proxy.expected.tsv -
          mawk -f proxy.awk tests/proxy.tsv | diff -u tests/proxy.expected.tsv -
          busybox awk -f proxy.awk tests/proxy.tsv | diff -u tests/proxy.expected.tsv -
      - name: Committed proxy.actual.tsv equals the oracle
        working-directory: native
        run: cmp tests/proxy.expected.tsv tests/proxy.actual.tsv

  agda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Agda (Ubuntu package; Trust.agda needs only Agda.Builtin)
        run: sudo apt-get update -q && sudo apt-get install -y -q agda-bin
      - name: agda --safe Trust.agda
        working-directory: native
        run: agda --version && agda --safe Trust.agda

  futhark:
    runs-on: ubuntu-latest
    env:
      FUTHARK_VERSION: 0.29.1
    steps:
      - uses: actions/checkout@v4
      - name: Install Futhark release tarball
        run: |
          curl -fsSL -o futhark.tar.xz \
            "https://github.com/diku-dk/futhark/releases/download/v${FUTHARK_VERSION}/futhark-${FUTHARK_VERSION}-linux-x86_64.tar.xz"
          tar -xJf futhark.tar.xz
          echo "$PWD/futhark-${FUTHARK_VERSION}-linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: futhark check geometry.fut
        working-directory: native
        run: futhark --version && futhark check geometry.fut

  alloy:
    runs-on: ubuntu-latest
    env:
      ALLOY_VERSION: 6.2.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download Alloy jar
        run: |
          curl -fsSL -o alloy.jar \
            "https://github.com/AlloyTools/org.alloytools.alloy/releases/download/v${ALLOY_VERSION}/org.alloytools.alloy.dist.jar"
      - name: Run every check and run command in Trust.als
        run: |
          java -jar alloy.jar exec -f -o alloy-out -t text native/Trust.als 2>&1 | tee alloy.log
          awk -v expected=9 -f ci/alloy-verdicts.awk alloy.log
